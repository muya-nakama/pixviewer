name: Build and publish APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/restore-signing.py'
      - 'scripts/update-manifest.py'
      - 'RELEASE_NOTES.md'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  pull_request:
permissions:
  contents: read
concurrency:
  group: pixviewer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Select version
        run: |
          echo "APP_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Load private signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: python3 scripts/restore-signing.py
      - name: Compile, test and lint
        run: gradle :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" --no-daemon
      - name: Prepare verified release
        if: env.PIXVIEWER_KEYSTORE != ''
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/pixviewer.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/pixviewer.apk
          python3 scripts/update-manifest.py
      - name: Publish signed APK and update manifest
        if: env.PIXVIEWER_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${APP_VERSION_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "pixviewer ${APP_VERSION_NAME}" --notes-file RELEASE_NOTES.md --draft
          gh release upload "$tag" dist/pixviewer.apk dist/update.json --clobber
          gh release edit "$tag" --draft=false --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixviewer-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/
            dist/
          if-no-files-found: ignore
      - name: Signing setup status
        if: env.PIXVIEWER_KEYSTORE == '' && github.event_name != 'pull_request'
        run: |
          echo '::warning::Build checks completed, but no installable release was published. Add the ANDROID_SIGNING repository secret, then run this workflow again.'
          echo '### 署名設定待ち' >> "$GITHUB_STEP_SUMMARY"
          echo 'コンパイル・テスト・Lintを実行しました。配布APKを公開するには ANDROID_SIGNING の登録が必要です。READMEの初回設定を参照してください。' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pixviewer.p12"
